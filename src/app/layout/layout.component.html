<header>
    <nav>
        <mat-toolbar class="toolbar">
            <button matButton (click)="goToPortfolio()">
                <mat-icon>home</mat-icon>Portfolio
            </button>
            <button matButton [matMenuTriggerFor]="hubMenu">
                <mat-icon>hub</mat-icon>API Hub
            </button>
            <mat-menu #hubMenu="matMenu">
                <button mat-menu-item (click)="goToHub()">
                    <mat-icon>dashboard</mat-icon>Overview
                </button>
                <button mat-menu-item (click)="goToGitHub()">
                    <mat-icon>code</mat-icon>GitHub
                </button>
                <button mat-menu-item (click)="goToWeather()">
                    <mat-icon>sunny</mat-icon>Weather
                </button>
            </mat-menu>
            <button matButton (click)="goToCaribouCrossing()">
                <mat-icon>videogame_asset</mat-icon>Caribou Crossing
            </button>
            <span class="spacer"></span>
            <button matButton (click)="goToSource()">
                <mat-icon>commit</mat-icon>See Source
            </button>
        </mat-toolbar>
    </nav>
</header>

<main class="content">
    <router-outlet></router-outlet>
</main>
